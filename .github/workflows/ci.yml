name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kits:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        kit: [opencode-go-provider, pi-coding-agent, first-mate-skill, claude-code]
        python: ["3.14"]
        include:
          - kit: claude-code
            python: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Node.js
        if: matrix.kit == 'opencode-go-provider' || matrix.kit == 'pi-coding-agent'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Run kit's offline tests
        env:
          KIT: ${{ matrix.kit }}
        run: python scripts/run-kit-tests.py "$KIT" --install

  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out pinned Patterns validators
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: GSA-TTS/agentic-coding-patterns
          ref: a290d5d80737fc739e7ec139da0eeaf438631631
          path: .patterns
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install hash-locked shared tools
        run: |
          python -m venv .tmp/ci-venv
          .tmp/ci-venv/bin/python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-dev.lock
      - name: Lint, format, infrastructure tests, and all kit contracts
        run: |
          make lint validate
          .tmp/ci-venv/bin/python -m pytest scripts/tests -q
      - name: Install checksum-pinned Gitleaks (no action token or license)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/gitleaks
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            -o .tmp/gitleaks/archive.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  .tmp/gitleaks/archive.tar.gz' | sha256sum --check
          tar -xzf .tmp/gitleaks/archive.tar.gz -C .tmp/gitleaks gitleaks
      - name: Dependency audit, unsafe shell, and secrets scans
        run: make security GITLEAKS="$PWD/.tmp/gitleaks/gitleaks"
