commands:
  - phase: startup
    # The hybrid/v1 `user` field is a numeric uid pattern; the paseo kit uses the
    # same value for the same reason. acq runs the startup phase as the agent user.
    user: "1000"
    background: true
    description: Install the pinned Paseo plugins once the daemon is up (background, never fails the sandbox)
    command:
      - sh
      - -c
      - |
        sh /home/agent/paseo-plugins-install.sh &

agentContext: |
  ## Personal skills

  Personal skills are installed under `~/.agents/skills/`.

  - `paseo-first-mate`: load it when the user asks you to coordinate several
    agents, issues, or dependent pull requests. Copy its `assets/` scripts into
    the coordinator worktree's git-ignored `tmp/` as the skill describes rather
    than running them in place.
  - Paseo plugins: at startup a background script enables plugins on the Paseo
    daemon and installs the ones listed in `~/paseo-plugins-install.sh`. Its log
    is `~/.local/state/paseo/paseo-plugins.log`; `paseo plugin ls` shows the
    result. It does nothing when the paseo kit is not applied.
  - Matt Pocock's skills (`ask-matt`, `tdd`, `triage`, `wayfinder`, `handoff`,
    `teach`, and others). 16 of the 27 are user-invoked: run those only when the
    user types the name. `teach` fills the directory it runs in with lesson files, so
    do not start it inside a code repository.
    His code-review skill is `pocock-code-review`; plain `code-review` is a
    different skill. Skills that publish to an issue tracker expect the project
    to have run `/setup-matt-pocock-skills` once.

  Licence notices for the third-party skills are in `~/.agents/licenses/`.
