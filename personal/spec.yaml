# spec.yaml — personal (a neutral acq mixin kit, hybrid/v1)
#
# PERSONAL KIT: the author's own layer on top of the global kits, applied last
# with --kit or ACQ_EXTRA_KITS. It drops Agent Skills into the cross-agent
# skills root, ~/.agents/skills, which OpenCode, Codex, Docker Agent, and
# Copilot all scan, and installs the author's Paseo plugins. It carries no
# agent and no provider.
#
# Skills today:
#   paseo-first-mate     the author's own skill plus two helper scripts
#   27 skills by Matt Pocock (mattpocock/skills, MIT), vendored at a pinned commit,
#   listed in the generated block below and in vendor/mattpocock-skills.json.
#   Credit, licences and every local difference: NOTICE and docs/vendored-skills.md.
#   Upstream's code-review is installed as pocock-code-review because the
#   playbook kit ships a different skill named code-review into the same
#   directory.
#
# ONE COMMAND, AT STARTUP, IN THE BACKGROUND: the skills are dropped at their
# final path, so they need no command. The one startup command runs
# paseo-plugins-install.sh, which waits for the Paseo daemon that the separate
# `paseo` kit starts, turns on the daemon's plugin switch, and installs the
# plugins listed in that script at pinned commits. It is detached, always exits
# 0, and logs to ~/.local/state/paseo/paseo-plugins.log, so it cannot fail a
# sandbox create. Without the paseo kit it logs that the daemon never came up and
# installs nothing. See docs/decisions/0003.
#
# EGRESS: github.com for `git clone` of git-sourced plugins, registry.npmjs.org for
# npm-sourced ones. The skills themselves need none; the first-mate scripts call the `gh` and `paseo`
# CLIs when the agent runs them, and those CLIs' needs belong to other kits.
#
# NO `agent:` BLOCK and NO published ports: this is an opt-in --kit mixin.
#
# The vendored block is generated by scripts/vendor-pocock-skills. Edit that
# script, not the block. See docs/decisions/ for why the kit is shaped this way.
schemaVersion: "hybrid/v1"
kind: mixin
name: personal
displayName: Personal kit
description: >
  The author's personal layer for coding agents in the sandbox: the Paseo
  First Mate skill and a vendored copy of Matt Pocock's engineering skills,
  dropped into ~/.agents/skills, plus a startup step that installs pinned Paseo
  plugins into the Paseo daemon when the paseo kit is also applied. Opt-in
  mixin; egress to github.com and registry.npmjs.org only; no ports.

caps:
  network:
    allow:
      - github.com
      - registry.npmjs.org

files:
  - path: /home/agent/.agents/skills/paseo-first-mate/SKILL.md
    mode: "0644"
    source: files/home/.agents/skills/paseo-first-mate/SKILL.md
    description: The paseo-first-mate skill instructions
  - path: /home/agent/.agents/skills/paseo-first-mate/assets/first-mate-check.py
    mode: "0755"
    source: files/home/.agents/skills/paseo-first-mate/assets/first-mate-check.py
    description: Change detector for watched PRs, issues, releases, agents, and permissions
  - path: /home/agent/.agents/skills/paseo-first-mate/assets/first-mate-wait.sh
    mode: "0755"
    source: files/home/.agents/skills/paseo-first-mate/assets/first-mate-wait.sh
    description: Background wait loop that runs the change detector until it reports a change
  - path: /home/agent/.agents/licenses/humanlayer-skills-LICENSE
    mode: "0644"
    source: files/home/.agents/licenses/humanlayer-skills-LICENSE
    description: MIT notice for HumanLayer's show-me skill, adapted inside the pr skill
  - path: /home/agent/paseo-plugins-install.sh
    mode: "0755"
    source: files/home/paseo-plugins-install.sh
    description: Wait for the Paseo daemon, enable plugins, and install the pinned plugin list
